<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Dispatch board · Mettle & Co</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 2rem; background: #f6f6f4; color: #222; }
    form { display: flex; gap: 1rem; align-items: end; margin-bottom: 1rem; }
    label { display: flex; flex-direction: column; font-size: 0.9rem; gap: 0.25rem; }
    #status { min-height: 1.5rem; margin-bottom: 1rem; color: #666; }
    #status.error { color: #b00020; font-weight: 600; }
    #cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 1rem; }
    .card { background: #fff; border-radius: 8px; padding: 1rem; border-left: 6px solid #999; }
    .card.free { border-left-color: #2e7d32; }
    .card.busy { border-left-color: #c62828; }
    .card h2 { font-size: 1.1rem; margin: 0 0 0.5rem; }
    .card p { margin: 0 0 0.75rem; font-size: 0.9rem; color: #555; }
    .badge { font-size: 0.8rem; font-weight: 700; text-transform: uppercase; }
    .free .badge { color: #2e7d32; }
    .busy .badge { color: #c62828; }
    #cards.stale { opacity: 0.4; }
  </style>
</head>
<body>
  <h1>Dispatch board</h1>
  <form>
    <label>Start <input id="start" type="datetime-local" value="2026-12-31T09:00"></label>
    <label>End <input id="end" type="datetime-local" value="2026-12-31T12:00"></label>
  </form>
  <div id="status"></div>
  <div id="cards"></div>

  <script>
    const REFRESH_MS = 5000;
    const startInput = document.getElementById("start");
    const endInput = document.getElementById("end");
    const status = document.getElementById("status");
    const cards = document.getElementById("cards");
    let heroes = [];

    function showError(message) {
      status.textContent = message;
      status.className = "error";
      cards.classList.add("stale");
    }

    async function errorMessage(response) {
      const body = await response.json().catch(() => null);
      const detail = body && body.detail;
      if (Array.isArray(detail)) return detail.map((d) => d.msg).join("; ");
      return detail || `HTTP ${response.status}`;
    }

    function render(freeNames) {
      cards.replaceChildren(...heroes.map((hero) => {
        const free = freeNames.has(hero.name);
        const card = document.createElement("div");
        card.className = `card ${free ? "free" : "busy"}`;
        const name = document.createElement("h2");
        name.textContent = hero.name;
        const power = document.createElement("p");
        power.textContent = hero.power;
        const badge = document.createElement("span");
        badge.className = "badge";
        badge.textContent = free ? "free" : "busy";
        card.append(name, power, badge);
        return card;
      }));
      cards.classList.remove("stale");
      status.className = "";
      status.textContent = `Updated ${new Date().toLocaleTimeString()}`;
    }

    async function refresh() {
      try {
        const params = new URLSearchParams({ start: startInput.value, end: endInput.value });
        const response = await fetch(`/heroes/available?${params}`);
        if (!response.ok) return showError(await errorMessage(response));
        const available = await response.json();
        render(new Set(available.map((hero) => hero.name)));
      } catch (error) {
        showError(`Could not reach the server: ${error.message}`);
      }
    }

    async function start() {
      try {
        const response = await fetch("/heroes");
        if (!response.ok) return showError(await errorMessage(response));
        heroes = await response.json();
      } catch (error) {
        return showError(`Could not reach the server: ${error.message}`);
      }
      startInput.addEventListener("change", refresh);
      endInput.addEventListener("change", refresh);
      await refresh();
      setInterval(refresh, REFRESH_MS);
    }

    start();
  </script>
</body>
</html>
